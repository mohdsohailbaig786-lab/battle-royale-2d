'use strict';
// STRINGS — every visible label, including loot and weapon names.
const S={title:'Battle Royale 2D',badge:'JUNGLE / PROTOTYPE 02',solo:'Solo vs Bots',intro:'12 khiladi. Jungle mein loot uthao, zone ke andar raho aur aakhri tak tikke raho!',help:'Baaya stick: chalo. Daaya stick: kheench kar nishana aur goli; chhodo toh band. PC: WASD / arrows, mouse + hold click. Q / scroll: bandook badlo. E: dawa. Loot paas aate hi uthti hai.',start:'Khel Shuru Karo',again:'Phir Se Khelo',win:'Aakhri bachne wale tum ho! Jeet! #1',lose:'Iss baar haar gaye!',place:'Jagah',of:' / 12',cause:'Kis se haare',zoneCause:'Zone',bot:'Bot',health:'Jaan',alive:'Zinda',kills:'Kills',fire:'Dabao',aim:'Nishana',easy:'Aasan Mode — nazdeek saaf dikhte dushman par nishana',switch:'Badlo',heal:'Dawa',empty:'Goli khatam! Ammo dhoondo.',tip:'Loot paas jaakar uthao · Q: badlo · E: dawa',joystick:'Chalne ka joystick',aimStick:'Nishane ka joystick',pistol:'Pistol',rifle:'Rifle',shotgun:'Shotgun',ammo:'Goli',med:'Dawa +50',outside:'Zone se bahar ho! Andar bhaago!',hold:'Agla zone',shrink:'Zone sikud raha hai',final:'Aakhri zone',seconds:'s',next:'Safed ghera: agla zone',winInfo:'Jungle ke aakhri khiladi tum ho!',kitUsed:'Dawa lag gayi +50',gunLoot:'Bandook mili',ammoLoot:'Goli mili',kitLoot:'Dawa mili',swap:'Badli hui bandook paas hai',version:'Prototype 02'};
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d',{alpha:false});
for(const [id,key] of Object.entries({title:'title',badge:'badge',intro:'intro',help:'help',start:'start',tip:'tip',easyText:'easy'}))$(id).textContent=S[key];
$('intro').textContent=S.solo+' · '+S.intro;$('pad').setAttribute('aria-label',S.joystick);$('fire').setAttribute('aria-label',S.aimStick);document.title=S.title;
// WORLD — prototype one's 1600-unit jungle, seeded scenery and clear spawn pockets.
const W=1600,obstacles=[],bushes=[],spawns=[[800,800]];let seed=42;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ENTITIES — identical health, speed and weapon damage for everyone. Bounded pools.

const bullets=Array.from({length:240},()=>({active:false})),effects=Array.from({length:40},()=>({life:0}));
let player,bots=[],actors=[],loot=[],kills=0,state='menu',vw=0,vh=0,cx=0,cy=0,last=0,time=0,easy=false,notice='',noticeUntil=0,hitMark=0,zone,phase=0,phaseStart=0,phaseFrom;
const phases=[{hold:30,shrink:35,r:820},{hold:15,shrink:35,r:560},{hold:15,shrink:35,r:330},{hold:15,shrink:30,r:140},{hold:10,shrink:20,r:35}];
function entity(x,y,id=0){return{x,y,id,r:14,hp:100,angle:-Math.PI/2,cd:0,flash:0,muzzle:0,dead:0,heading:rand()*6.28,slots:['pistol',null],slot:0,ammo:{pistol:54,rifle:0,shotgun:0},meds:1,think:rand()*.18,target:null,acquired:0,reaction:.25+rand()*.35,mode:'wander',vx:0,vy:0,stuck:0,px:x,py:y,escape:0,lootAt:0,cause:''}}
function alive(){return actors.filter(a=>a.hp>0).length}
function reset(){player=entity(800,800);bots=spawns.slice(1).map((p,i)=>entity(p[0],p[1],i+1));actors=[player,...bots];for(const b of bullets)b.active=false;for(const e of effects)e.life=0;kills=time=0;phase=phaseStart=0;notice='';hitMark=0;zone={x:800,y:800,r:1140,nx:800,ny:800,nr:820};phaseFrom={x:800,y:800,r:1140};makeLoot();easy=$('easy').checked;state='play';$('layer').style.display='none';$('fire').style.background=easy?'#88632c77':'#0a241b66';release();last=0;hud()}
function hud(){let hp=Math.max(0,Math.ceil(player.hp)),gun=player.slots[player.slot];$('health').textContent=S.health+' '+hp+' / 100';$('health').style.borderImage='linear-gradient(to right,#d4fa80 '+hp+'%,#4d5c46 '+hp+'%) 1';$('stats').textContent=S.alive+': '+alive()+' · '+S.kills+': '+kills+'\n'+S[gun]+' · '+player.ammo[gun];$('stats').style.whiteSpace='pre-line';$('switch').textContent=S.switch+' · '+S[player.slots[1-player.slot]||gun];$('heal').textContent=S.heal+' ('+player.meds+')';let p=phases[phase],elapsed=time-phaseStart,remaining=p?Math.ceil((elapsed<p.hold?p.hold:p.hold+p.shrink)-elapsed):0;let outside=zone&&dist(player,zone)>zone.r;$('zoneText').textContent=outside?S.outside:noticeUntil>time?notice:(p?(elapsed<p.hold?S.hold:S.shrink)+' · '+remaining+S.seconds+' · '+S.next:S.final);$('zoneText').style.color=outside?'#ff9a86':'#fff0ac'}
function end(win){state='end';release();$('title').textContent=win?S.win:S.lose;$('intro').textContent=win?S.winInfo:S.place+' #'+(alive()+1)+S.of+' · '+S.cause+': '+player.cause;$('start').textContent=S.again;$('layer').style.display='grid'}
$('start').onclick=reset;
// INPUT — separate pointer capture for both sticks, release on cancel/blur.
const keys={};let jx=0,jy=0,joyId=null,fireId=null,firing=false,mouseDown=false,mx=0,my=0,mouseAim=false;
function release(){jx=jy=0;joyId=fireId=null;firing=mouseDown=false;for(const k in keys)keys[k]=false;$('knob').style.transform=$('aimKnob').style.transform='';mouseAim=false}
function switchGun(){if(state==='play'&&player.slots[1-player.slot])player.slot=1-player.slot}
function heal(a){if(a.hp>0&&a.hp<100&&a.meds>0){a.hp=Math.min(100,a.hp+50);a.meds--;if(a===player){notice=S.kitUsed;noticeUntil=time+2}}}
$('switch').onclick=switchGun;$('heal').onclick=()=>{if(state==='play')heal(player)};
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(!e.repeat){if(e.key.toLowerCase()==='q')switchGun();if(e.key.toLowerCase()==='e'&&state==='play')heal(player)}keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{release();last=0});
function stick(el,knob,e,left){let r=el.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.max(40,Math.hypot(x,y));if(left){jx=x/n;jy=y/n}else{mouseAim=false;if(!easy&&Math.hypot(x,y)>5)player.angle=Math.atan2(y,x)}knob.style.transform='translate('+x/n*32+'px,'+y/n*32+'px)'}
for(const left of [true,false]){let el=$(left?'pad':'fire'),knob=$(left?'knob':'aimKnob');el.onpointerdown=e=>{e.preventDefault();if(state!=='play'||(left?joyId:fireId)!==null)return;if(left)joyId=e.pointerId;else{fireId=e.pointerId;firing=true}el.setPointerCapture(e.pointerId);stick(el,knob,e,left)};el.onpointermove=e=>{if(e.pointerId===(left?joyId:fireId))stick(el,knob,e,left)};el.onpointerup=el.onpointercancel=el.onlostpointercapture=e=>{if(e.pointerId===(left?joyId:fireId)){if(left){joyId=null;jx=jy=0}else{fireId=null;firing=false}knob.style.transform=''}}}
c.onpointermove=e=>{if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;mouseAim=true}};c.onpointerdown=e=>{if(state!=='play'||e.pointerType!=='mouse')return;e.preventDefault();mx=e.clientX;my=e.clientY;mouseAim=true;mouseDown=true;c.setPointerCapture(e.pointerId)};c.onpointerup=c.onpointercancel=c.onlostpointercapture=()=>mouseDown=false;c.oncontextmenu=e=>e.preventDefault();c.onwheel=e=>{e.preventDefault();switchGun()};document.addEventListener('gesturestart',e=>e.preventDefault());
// PHYSICS — solid scenery and line-of-sight segment tests shared by AI and easy aim.
function move(a,dx,dy){a.x=clamp(a.x+dx,a.r,W-a.r);a.y=clamp(a.y+dy,a.r,W-a.r);for(let pass=0;pass<2;pass++)for(const o of obstacles){let x=a.x-o.x,y=a.y-o.y,d=Math.hypot(x,y),r=a.r+o.r;if(d<r){if(d<.001){x=1;d=1}a.x=o.x+x/d*r;a.y=o.y+y/d*r}}a.x=clamp(a.x,a.r,W-a.r);a.y=clamp(a.y,a.r,W-a.r)}

function nearest(a,visibleOnly=false){let best=null,d=540;for(const b of actors)if(b!==a&&b.hp>0){let n=dist(a,b);if(n<d&&(!visibleOnly||(b.x>cx&&b.x<cx+vw&&b.y>cy&&b.y<cy+vh))&&los(a,b)){best=b;d=n}}return best}
function shoot(a){let type=a.slots[a.slot],w=guns[type];if(a.cd>0||a.ammo[type]<=0)return;if(bullets.filter(b=>!b.active).length<w.pellets)return;a.ammo[type]--;a.cd=w.rate*(a===player?1:1.25);a.muzzle=.065;let error=a===player?0:(rand()-.5)*(.1+clamp(dist(a,a.target||a)/500,0,1)*.28)/Math.min(2,1+(time-a.acquired)/3);for(let i=0;i<w.pellets;i++){let b=bullets.find(b=>!b.active),angle=a.angle+error+(rand()-.5)*w.spread;Object.assign(b,{x:a.x+Math.cos(angle)*18,y:a.y+Math.sin(angle)*18,vx:Math.cos(angle)*w.speed,vy:Math.sin(angle)*w.speed,life:w.range/w.speed,active:true,owner:a,damage:w.damage,type,travel:0})}}
function spark(x,y,color){let e=effects.find(e=>e.life<=0);if(e)Object.assign(e,{x,y,color,life:.25})}
function damage(a,n,owner=null,type=null){if(a.hp<=0)return;a.hp=Math.max(0,a.hp-n);a.flash=.12;if(owner===player)hitMark=.13;if(a.hp===0){a.dead=.8;a.cause=owner?(owner===player?S.title:S.bot+' '+owner.id)+' · '+S[type]:S.zoneCause;if(owner===player&&a!==player)kills++;drop(a.x,a.y,'gun',a.slots[a.slot]);drop(a.x+20,a.y,'ammo',a.slots[a.slot]);if(a.meds)drop(a.x-20,a.y,'med');}}
// LOOT — auto pickup within 30 units, two slots, shared gun-specific reserves; no reload wait.
function drop(x,y,kind,type='pistol',delay=0){if(loot.length<200)loot.push({x,y,kind,type,active:true,ready:time+delay})}
function makeLoot(){loot=[];for(const p of spawns){drop(p[0]+40,p[1],'gun',rand()<.55?'rifle':'shotgun');drop(p[0]-40,p[1],'ammo','pistol');drop(p[0],p[1]+45,'med')}for(let i=0;i<65;i++){let p={x:70+rand()*1460,y:70+rand()*1460};if(obstacles.some(o=>dist(o,p)<o.r+30))continue;let type=['pistol','rifle','shotgun'][Math.floor(rand()*3)];drop(p.x,p.y,i%5===0?'med':i%3===0?'gun':'ammo',type)}}
function pickup(a){for(const l of loot)if(l.active&&time>=l.ready&&dist(a,l)<30){if(l.kind==='med'){if(a.meds>=3)continue;a.meds++;}else if(l.kind==='ammo'){a.ammo[l.type]=Math.min(240,a.ammo[l.type]+guns[l.type].grant)}else{if(a!==player&&a.slots.includes(l.type))continue;let empty=a.slots.indexOf(null);if(!a.slots.includes(l.type)){let slot=empty>=0?empty:a.slot,prev=a.slots[slot];a.slots[slot]=l.type;a.slot=slot;if(prev)drop(l.x+32,l.y,'gun',prev,2)}a.ammo[l.type]=Math.min(240,a.ammo[l.type]+guns[l.type].grant)}l.active=false;if(a===player){notice=S[l.kind==='med'?'kitLoot':l.kind==='gun'?'gunLoot':'ammoLoot'];noticeUntil=time+1.5}}}
// ZONE — 30s grace, five visible next circles, final radius 35 at 240s.
function updateZone(dt){if(phase<phases.length){let p=phases[phase],elapsed=time-phaseStart,k=clamp((elapsed-p.hold)/p.shrink,0,1);zone.x=phaseFrom.x+(zone.nx-phaseFrom.x)*k;zone.y=phaseFrom.y+(zone.ny-phaseFrom.y)*k;zone.r=phaseFrom.r+(p.r-phaseFrom.r)*k;if(elapsed>=p.hold+p.shrink){phaseStart+=p.hold+p.shrink;phase++;phaseFrom={x:zone.x,y:zone.y,r:zone.r};if(phase<phases.length){let nr=phases[phase].r,angle=rand()*6.28,shift=(zone.r-nr)*.35;zone.nx=zone.x+Math.cos(angle)*shift;zone.ny=zone.y+Math.sin(angle)*shift;zone.nr=nr}}}else{zone.r=Math.max(0,35-(time-240)*2)}for(const a of actors)if(a.hp>0&&dist(a,zone)>zone.r)damage(a,(2+time/35)*dt)}
// AI — staggered decisions; fair reaction time, engage anyone, heal/loot/zone priorities.
function think(a){let target=nearest(a),outside=dist(a,zone)>Math.max(10,zone.r-45),closing=phase<phases.length&&time-phaseStart>phases[phase].hold;let goal=null;
if(a.hp<45&&a.meds){a.mode='retreat';heal(a);goal=target?{x:a.x+(a.x-target.x),y:a.y+(a.y-target.y)}:zone}
else if(outside||(closing&&Math.hypot(a.x-zone.nx,a.y-zone.ny)>zone.nr*.85)){a.mode='zone';goal={x:zone.nx,y:zone.ny}}
else if(target){a.mode='engage';let d=dist(a,target);goal=d>240?target:d<130?{x:a.x+(a.x-target.x),y:a.y+(a.y-target.y)}:{x:a.x+Math.cos(time+a.id)*70,y:a.y+Math.sin(time+a.id)*70}}
else{let best=null,d=230;for(const l of loot)if(l.active&&time>=l.ready&&(l.kind!=='med'||a.meds<3)&&(l.kind!=='gun'||!a.slots.includes(l.type))&&dist(a,l)<d){d=dist(a,l);best=l}if(best){a.mode='loot';goal=best}else{a.mode='wander';a.heading+=(rand()-.5)*.9;goal={x:a.x+Math.cos(a.heading)*100,y:a.y+Math.sin(a.heading)*100}}}
if(target!==a.target){a.target=target;a.acquired=time;a.reaction=.25+rand()*.35}let dx=goal.x-a.x,dy=goal.y-a.y,n=Math.max(1,Math.hypot(dx,dy));a.vx=dx/n;a.vy=dy/n;
// Choose the closest clear heading from a steering fan, avoiding solid geometry.
let desired=Math.atan2(a.vy,a.vx),offsets=[0,.5,-.5,1,-1,1.6,-1.6,2.3,-2.3,Math.PI];if(a.escape>time)desired=a.heading;for(const off of offsets){let angle=desired+off,x=a.x+Math.cos(angle)*65,y=a.y+Math.sin(angle)*65;if(x<20||y<20||x>W-20||y>W-20||obstacles.some(o=>Math.hypot(x-o.x,y-o.y)<o.r+24))continue;a.vx=Math.cos(angle);a.vy=Math.sin(angle);break}
}
// SIMULATION — bounded delta, projectile substeps; owner-specific kills and all deaths.
function update(dt){time+=dt;updateZone(dt);let x=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=jy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),n=Math.max(1,Math.hypot(x,y));if(player.hp>0)move(player,x/n*205*dt,y/n*205*dt);if(mouseAim)player.angle=Math.atan2(my+cy-player.y,mx+cx-player.x);else if(easy){let t=nearest(player,true);if(t)player.angle=Math.atan2(t.y-player.y,t.x-player.x)}
for(const a of actors){a.cd-=dt;a.flash-=dt;a.muzzle-=dt;a.dead-=dt;if(a.hp<=0)continue;if(a===player){if(firing||mouseDown)shoot(a)}else{a.think-=dt;if(a.think<=0){think(a);a.think=.1+rand()*.1}move(a,a.vx*205*dt,a.vy*205*dt);a.stuck+=dt;if(a.stuck>1){if(Math.hypot(a.x-a.px,a.y-a.py)<14){a.heading=rand()*6.28;a.escape=time+1.4;a.think=0}a.px=a.x;a.py=a.y;a.stuck=0}if(a.target&&a.target.hp>0){a.angle=Math.atan2(a.target.y-a.y,a.target.x-a.x);if(time-a.acquired>a.reaction&&los(a,a.target)&&dist(a,a.target)<guns[a.slots[a.slot]].range)shoot(a)}else a.angle=Math.atan2(a.vy,a.vx)}a.lootAt-=dt;if(a.lootAt<=0){pickup(a);a.lootAt=.12}}
for(const b of bullets){if(!b.active)continue;b.life-=dt;if(b.life<=0){b.active=false;continue}for(let i=0;i<3&&b.active;i++){b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;b.travel+=Math.hypot(b.vx,b.vy)*dt/3;if(b.x<0||b.y<0||b.x>W||b.y>W||obstacles.some(o=>Math.hypot(b.x-o.x,b.y-o.y)<o.r+3)){b.active=false;spark(b.x,b.y,'#c7d2b0');break}for(const a of actors)if(a!==b.owner&&a.hp>0&&Math.hypot(b.x-a.x,b.y-a.y)<17){damage(a,b.damage*(b.type==='shotgun'?Math.max(.2,1-b.travel/320):1),b.owner,b.type);spark(b.x,b.y,'#ffe9ab');b.active=false;break}}}for(const e of effects)e.life-=dt;hitMark-=dt;hud();if(player.hp<=0)end(false);else if(alive()===1)end(true)}
function visible(a,r){return a.x>cx-r&&a.x<cx+vw+r&&a.y>cy-r&&a.y<cy+vh+r}
