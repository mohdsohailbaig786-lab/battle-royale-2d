<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Battle Royale 2D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#102b24;color:#eef9dd;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;pointer-events:none;display:flex;justify-content:space-between;font-weight:700;font-size:14px;text-shadow:0 2px #102b24}#health{border-bottom:5px solid #d4fa80;padding-bottom:5px}#layer{position:fixed;inset:0;display:grid;place-items:center;background:#071c18c9;padding:24px}.card{max-width:420px;border:1px solid #a5cd6555;background:#153c32;border-radius:24px;padding:28px;box-shadow:0 20px 80px #0007}h1{font-size:36px;line-height:1.05;margin:12px 0}p{line-height:1.6;color:#c9dbc4}small{color:#b8d49e;letter-spacing:2px}button{border:0;background:#d4fa80;color:#163426;border-radius:14px;font:700 17px system-ui;padding:16px 24px;width:100%;cursor:pointer}#pad,#fire{position:fixed;bottom:max(28px,env(safe-area-inset-bottom));border:2px solid #e5ffb84d;background:#0a241b66;border-radius:50%;touch-action:none;user-select:none;-webkit-user-select:none}#pad{left:22px;width:116px;height:116px}#knob{position:absolute;left:34px;top:34px;width:44px;height:44px;background:#d4fa8077;border-radius:50%;pointer-events:none}#fire{right:24px;width:90px;height:90px;color:#e5ffb8;padding:0}#tip{position:fixed;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#c9dbc4;pointer-events:none}@media(max-height:450px){.card{padding:16px}h1{font-size:26px}p{margin:8px 0}#pad{width:100px;height:100px}#knob{left:26px;top:26px}}</style><canvas id="game"></canvas><div id="hud"><span id="health"></span><span id="stats"></span></div><div id="pad"><div id="knob"></div></div><button id="fire"></button><div id="tip"></div><div id="layer"><section class="card"><small id="badge"></small><h1 id="title"></h1><p id="intro"></p><p id="help"></p><button id="start"></button></section></div><script>
'use strict';
// STRINGS: all visible interface copy is kept here for future translation.
const S={title:'Battle Royale 2D',badge:'JUNGLE / PROTOTYPE 01',intro:'Chhota jungle, ek pistol, teen bots. Aakhri tak tikke raho!',help:'Baaye joystick se chalo. Daaye FIRE daba ke rakho — sabse nazdeek bot par nishana. PC: WASD / arrow keys + mouse se nishana aur click.',start:'Khel Shuru Karo',again:'Phir Se Khelo',win:'Sab bots hara diye! Jeet!',lose:'Iss baar haar gaye!',winInfo:'Jungle saaf! Teenon bots hara diye.',loseInfo:'Ped aur patthar ki aad lo, phir koshish karo.',health:'Jaan',bots:'Bots',kills:'Kills',fire:'FIRE',tip:'Pistol · unlimited goli · ped aur patthar se aad lo',joystick:'Chalne ka joystick'};
const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d',{alpha:false});
$('title').textContent=S.title;$('badge').textContent=S.badge;$('intro').textContent=S.intro;$('help').textContent=S.help;$('start').textContent=S.start;$('fire').textContent=S.fire;$('tip').textContent=S.tip;$('pad').setAttribute('aria-label',S.joystick);
// WORLD: seeded scenery with clear spawn pockets in a 1600-unit arena.
const W=1600,obstacles=[],bushes=[],spawns=[[800,800],[800,430],[1200,1140],[380,1150]];let seed=42;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<90;i++){let x=55+rand()*1490,y=55+rand()*1490,r=18+rand()*17;if(spawns.some(p=>Math.hypot(x-p[0],y-p[1])<130))continue;obstacles.push({x,y,r,rock:rand()<.27})}
for(let i=0;i<65;i++)bushes.push({x:rand()*W,y:rand()*W,r:12+rand()*18});
// ENTITIES: fixed projectile/effect pools; no unbounded particles.
const bullets=Array.from({length:100},()=>({active:false})),effects=Array.from({length:24},()=>({life:0}));let player,bots=[],kills=0,state='menu',vw=0,vh=0,cx=0,cy=0,last=0;
function entity(x,y){return{x,y,r:14,hp:100,angle:-Math.PI/2,cd:0,flash:0,muzzle:0,dead:0,wander:0,heading:0}}
function reset(){player=entity(800,800);bots=spawns.slice(1).map(p=>entity(p[0],p[1]));for(const b of bullets)b.active=false;for(const e of effects)e.life=0;kills=0;state='play';$('layer').style.display='none';release();hud()}
function hud(){const hp=Math.max(0,Math.ceil(player?.hp??100));$('health').textContent=S.health+' '+hp+' / 100';$('health').style.borderImage='linear-gradient(to right,#d4fa80 '+hp+'%,#4d5c46 '+hp+'%) 1';$('stats').textContent=S.bots+' '+(3-kills)+' · '+S.kills+' '+kills}
function end(win){state='end';release();$('title').textContent=win?S.win:S.lose;$('intro').textContent=win?S.winInfo:S.loseInfo;$('start').textContent=S.again;$('layer').style.display='grid'}
$('start').onclick=reset;
// INPUT: independent captured pointers support simultaneous move + fire.
const keys={};let jx=0,jy=0,joyId=null,fireId=null,firing=false,mouseDown=false,mx=0,my=0,mouseAim=false;
function release(){jx=jy=0;joyId=fireId=null;firing=mouseDown=false;for(const k in keys)keys[k]=false;$('knob').style.transform='';mouseAim=false}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{release();last=0});
const pad=$('pad');function joystick(e){const r=pad.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,n=Math.max(40,Math.hypot(x,y));jx=x/n;jy=y/n;$('knob').style.transform='translate('+jx*34+'px,'+jy*34+'px)'}
pad.onpointerdown=e=>{e.preventDefault();if(joyId!==null)return;joyId=e.pointerId;pad.setPointerCapture(joyId);joystick(e)};pad.onpointermove=e=>{if(e.pointerId===joyId)joystick(e)};pad.onpointerup=pad.onpointercancel=e=>{if(e.pointerId===joyId){joyId=null;jx=jy=0;$('knob').style.transform=''}};
$('fire').onpointerdown=e=>{e.preventDefault();fireId=e.pointerId;firing=true;mouseAim=false;$('fire').setPointerCapture(fireId)};$('fire').onpointerup=$('fire').onpointercancel=()=>{firing=false;fireId=null};
c.onpointermove=e=>{if(e.pointerType==='mouse'){mx=e.clientX;my=e.clientY;mouseAim=true}};c.onpointerdown=e=>{e.preventDefault();mx=e.clientX;my=e.clientY;mouseAim=e.pointerType==='mouse';mouseDown=true;c.setPointerCapture(e.pointerId)};c.onpointerup=c.onpointercancel=()=>mouseDown=false;c.oncontextmenu=e=>e.preventDefault();
// PHYSICS: substeps keep fast dots from tunnelling through solid circles.
function move(a,dx,dy){a.x=Math.max(a.r,Math.min(W-a.r,a.x+dx));a.y=Math.max(a.r,Math.min(W-a.r,a.y+dy));for(const o of obstacles){let x=a.x-o.x,y=a.y-o.y,d=Math.hypot(x,y),r=a.r+o.r;if(d<r){if(d<.001){x=1;d=1}a.x=o.x+x/d*r;a.y=o.y+y/d*r}}a.x=Math.max(a.r,Math.min(W-a.r,a.x));a.y=Math.max(a.r,Math.min(W-a.r,a.y))}
function shoot(a,enemy){if(a.cd>0)return;let b=bullets.find(b=>!b.active);if(!b)return;const angle=a.angle+(enemy?(rand()-.5)*.3:0);b.x=a.x+Math.cos(angle)*18;b.y=a.y+Math.sin(angle)*18;b.vx=Math.cos(angle)*690;b.vy=Math.sin(angle)*690;b.life=.82;b.enemy=enemy;b.active=true;a.cd=enemy?.92:.22;a.muzzle=.065}
function spark(x,y,color){const e=effects.find(e=>e.life<=0);if(e){e.x=x;e.y=y;e.life=.25;e.color=color}}
function hit(a,b){a.hp=Math.max(0,a.hp-25);a.flash=.12;spark(b.x,b.y,'#ffe9ab');if(a.hp===0&&a!==player){kills++;a.dead=.55}hud()}
function nearest(){let best=null,d=Infinity;for(const b of bots)if(b.hp>0){let n=(b.x-player.x)**2+(b.y-player.y)**2;if(n<d){best=b;d=n}}return best}
// AI: wander, pursue within 490 units, and fire with imperfect aim.
function update(dt){let x=jx+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),y=jy+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),n=Math.max(1,Math.hypot(x,y));move(player,x/n*205*dt,y/n*205*dt);player.cd-=dt;player.flash-=dt;player.muzzle-=dt;let target=nearest();if(mouseAim)player.angle=Math.atan2(my+cy-player.y,mx+cx-player.x);else if(target)player.angle=Math.atan2(target.y-player.y,target.x-player.x);if(firing||mouseDown||keys[' '])shoot(player,false);
for(const b of bots){b.flash-=dt;b.muzzle-=dt;if(b.hp<=0){b.dead-=dt;continue}b.cd-=dt;let dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy);if(d<490){b.angle=Math.atan2(dy,dx);if(d>175)move(b,dx/d*99*dt,dy/d*99*dt);shoot(b,true)}else{b.wander-=dt;if(b.wander<=0){b.heading=rand()*Math.PI*2;b.wander=1+rand()*2}b.angle=b.heading;move(b,Math.cos(b.heading)*62*dt,Math.sin(b.heading)*62*dt)}}
for(const b of bullets){if(!b.active)continue;b.life-=dt;if(b.life<=0){b.active=false;continue}for(let i=0;i<3&&b.active;i++){b.x+=b.vx*dt/3;b.y+=b.vy*dt/3;if(b.x<0||b.y<0||b.x>W||b.y>W){b.active=false;break}for(const o of obstacles)if((b.x-o.x)**2+(b.y-o.y)**2<(o.r+3)**2){b.active=false;spark(b.x,b.y,'#c7d2b0');break}if(!b.active)break;if(b.enemy){if(player.hp>0&&(b.x-player.x)**2+(b.y-player.y)**2<289){hit(player,b);b.active=false}}else for(const a of bots)if(a.hp>0&&(b.x-a.x)**2+(b.y-a.y)**2<289){hit(a,b);b.active=false;break}}}
for(const e of effects)e.life-=dt;if(player.hp<=0)end(false);else if(kills===3)end(true)}
// RENDER: cap DPR, cull scenery, clamp the camera, no audio/network.
function resize(){vw=innerWidth;vh=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);c.width=Math.round(vw*d);c.height=Math.round(vh*d);g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
function circle(x,y,r,color){g.fillStyle=color;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
function drawActor(a,enemy){if(a.hp<=0&&a.dead<=0)return;g.globalAlpha=a.hp>0?1:Math.max(0,a.dead/.55);circle(a.x+3,a.y+5,15,'#102d2788');circle(a.x,a.y,14,a.flash>0?'#fff6cf':enemy?'#ed815a':'#d4fa80');g.strokeStyle='#142f28';g.lineWidth=3;g.stroke();g.save();g.translate(a.x,a.y);g.rotate(a.angle);g.fillStyle='#203d39';g.fillRect(8,-4,20,8);if(a.muzzle>0){g.fillStyle='#fff0a0';g.fillRect(28,-6,10,12)}g.restore();if(enemy&&a.hp>0){g.fillStyle='#143027';g.fillRect(a.x-16,a.y-25,32,4);g.fillStyle='#ffa379';g.fillRect(a.x-16,a.y-25,32*a.hp/100,4)}g.globalAlpha=1}
function render(){cx=Math.max(0,Math.min(Math.max(0,W-vw),player.x-vw/2));cy=Math.max(0,Math.min(Math.max(0,W-vh),player.y-vh/2));g.fillStyle='#163b30';g.fillRect(0,0,vw,vh);g.save();g.translate(-cx,-cy);g.fillStyle='#315a38';g.fillRect(0,0,W,W);g.strokeStyle='#3c654044';g.lineWidth=1;g.beginPath();for(let x=0;x<=W;x+=80){g.moveTo(x,0);g.lineTo(x,W);g.moveTo(0,x);g.lineTo(W,x)}g.stroke();for(const b of bushes)if(b.x>cx-35&&b.x<cx+vw+35&&b.y>cy-35&&b.y<cy+vh+35){circle(b.x,b.y,b.r,'#416e3d');circle(b.x-7,b.y-5,b.r*.65,'#527b42')}g.strokeStyle='#a4bb6b';g.lineWidth=8;g.strokeRect(0,0,W,W);for(const o of obstacles)if(o.x>cx-50&&o.x<cx+vw+50&&o.y>cy-50&&o.y<cy+vh+50){circle(o.x+5,o.y+7,o.r,'#173c2d88');circle(o.x,o.y,o.r,o.rock?'#7d8d81':'#1c4932');circle(o.x-5,o.y-7,o.r*.72,o.rock?'#9baa94':'#32683e')}for(const b of bots)drawActor(b,true);drawActor(player,false);for(const b of bullets)if(b.active)circle(b.x,b.y,3,b.enemy?'#ffad80':'#fff3ab');for(const e of effects)if(e.life>0){g.globalAlpha=e.life*4;g.strokeStyle=e.color;g.lineWidth=2;g.beginPath();g.arc(e.x,e.y,3+(1-e.life*4)*15,0,Math.PI*2);g.stroke()}g.globalAlpha=1;g.restore()}
player=entity(800,800);function frame(t){const dt=last?Math.min((t-last)/1000,.033):0;last=t;if(state==='play'&&!document.hidden){const steps=Math.max(1,Math.ceil(dt/.012));for(let i=0;i<steps&&state==='play';i++)update(dt/steps)}render();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);
</script></html>
