const grenades=Array.from({length:24},()=>({active:false})),blasts=Array.from({length:12},()=>({life:0}));
let deathSaved=false,killer=null,follow=null;
function makeCrates(){for(let i=0;i<20;i++){for(let j=0;j<150;j++){let o={x:65+rand()*1470,y:65+rand()*1470,r:24,hp:100,crate:true};if(obstacles.some(b=>dist(b,o)<b.r+60)||spawns.some(p=>Math.hypot(p[0]-o.x,p[1]-o.y)<110))continue;obstacles.push(o);break}}}
function burst(x,y,color){for(let i=0;i<12;i++){let p=particles.find(p=>p.life<=0);if(!p)break;let a=Math.random()*6.28;Object.assign(p,{x,y,vx:Math.cos(a)*70,vy:Math.sin(a)*70,life:.45,color})}}
function hurtCrate(o,n){if(o.hp<=0)return;o.hp-=n;if(o.hp>0)return;let i=obstacles.indexOf(o);if(i>=0)obstacles.splice(i,1);burst(o.x,o.y,'#c48b4f');let count=1+Math.floor(rand()*3);for(let i=0;i<count;i++){let r=rand(),kind=r<.5?'ammo':r<.7?'med':r<.9?'grenade':'gun';drop(clamp(o.x+(rand()-.5)*50,20,W-20),clamp(o.y+(rand()-.5)*50,20,W-20),kind,['pistol','rifle','shotgun'][Math.floor(rand()*3)])}}
function melee(a){if(a.cd>0||a.hp<=0)return;a.cd=.5;a.slash=.18;a.revealUntil=time+5;for(const b of actors){if(b===a||b.hp<=0||dist(a,b)>55||!los(a,b))continue;let d=Math.atan2(Math.sin(Math.atan2(b.y-a.y,b.x-a.x)-a.angle),Math.cos(Math.atan2(b.y-a.y,b.x-a.x)-a.angle));if(Math.abs(d)<=Math.PI/3)damage(b,35,a,'knife')}for(const o of [...obstacles])if(o.crate&&dist(a,o)<=55+o.r){let d=Math.atan2(Math.sin(Math.atan2(o.y-a.y,o.x-a.x)-a.angle),Math.cos(Math.atan2(o.y-a.y,o.x-a.x)-a.angle));let edge={x:o.x-Math.cos(a.angle)*(o.r+3),y:o.y-Math.sin(a.angle)*(o.r+3)};if(Math.abs(d)<=Math.PI/3&&los(a,edge))hurtCrate(o,35)}}
function throwGrenade(a,angle=a.angle){if(!a.grenades||a.hp<=0)return;let b=grenades.find(b=>!b.active);if(!b)return;if(a===player&&easy){let t=nearest(a,true);if(t)angle=Math.atan2(t.y-a.y,t.x-a.x)}a.grenades--;a.grenadeAt=time+22+rand()*8;a.revealUntil=time+5;Object.assign(b,{active:true,owner:a,sx:a.x,sy:a.y,x:a.x,y:a.y,tx:clamp(a.x+Math.cos(angle)*200,8,W-8),ty:clamp(a.y+Math.sin(angle)*200,8,W-8),age:0})}
function updateGrenades(dt){for(const e of blasts)e.life=Math.max(0,e.life-dt);for(const b of grenades)if(b.active){b.age+=dt;let k=Math.min(1,b.age/.4);b.x=b.sx+(b.tx-b.sx)*k;b.y=b.sy+(b.ty-b.sy)*k;if(b.age<2.4)continue;b.active=false;let e=blasts.find(e=>e.life<=0);if(e)Object.assign(e,{x:b.x,y:b.y,life:.4});burst(b.x,b.y,'#ffd17a');if(dist(b,player)<160)shake=.1;for(const a of actors)if(a.hp>0&&dist(a,b)<=90)damage(a,90-70*dist(a,b)/90,b.owner,'grenade');for(const o of [...obstacles])if(o.crate&&dist(o,b)<=90)hurtCrate(o,90-70*dist(o,b)/90)}}
function cycleFollow(){let live=actors.filter(a=>a.hp>0);let i=live.indexOf(follow);follow=live[(i+1)%live.length]||null}
$('watch').textContent=S.watch;$('resultNow').textContent=S.result;$('cycle').textContent=S.switch;
$('watch').onclick=()=>{state='spectate';$('death').hidden=true;follow=killer&&killer.hp>0?killer:bots.filter(b=>b.hp>0).sort((a,b)=>dist(a,player)-dist(b,player))[0];release();document.body.classList.add('spectating');$('cycle').hidden=false;if(alive()<=1)end(false)};
$('resultNow').onclick=()=>{state='skip';end(false)};$('cycle').onclick=cycleFollow;
$('grenade').onclick=()=>{if(state==='play')throwGrenade(player)};
c.addEventListener('pointerdown',()=>{if(state==='spectate')cycleFollow()});
function drawNew(){for(const o of obstacles)if(o.crate&&visible(o,40)){g.fillStyle=o.hp<40?'#765039':'#ae783e';g.fillRect(o.x-24,o.y-24,48,48);g.strokeStyle='#51351f';g.lineWidth=3;g.strokeRect(o.x-24,o.y-24,48,48);g.beginPath();g.moveTo(o.x-22,o.y-8);g.lineTo(o.x+22,o.y-8);g.moveTo(o.x-22,o.y+8);g.lineTo(o.x+22,o.y+8);g.moveTo(o.x-20,o.y-20);g.lineTo(o.x+20,o.y+20);g.stroke();if(o.hp<40){g.strokeStyle='#e8b17b';g.beginPath();g.moveTo(o.x,o.y-22);g.lineTo(o.x-7,o.y);g.lineTo(o.x+4,o.y+20);g.stroke()}}for(const a of actors)if(a.slash>0&&visible(a,80)){g.strokeStyle='#fff0b0';g.lineWidth=4;g.beginPath();g.arc(a.x,a.y,50,a.angle-Math.PI/3,a.angle+Math.PI/3);g.stroke()}for(const b of grenades)if(b.active&&visible(b,50)){let k=Math.min(1,b.age/.4);circle(b.x,b.y,5,'#10251b');circle(b.x,b.y-Math.sin(k*Math.PI)*32,5,b.age>1.9?'#ffd17a':'#a5b65c')}for(const b of blasts)if(b.life>0&&visible(b,100)){g.globalAlpha=b.life/.4;g.strokeStyle='#ffd17a';g.lineWidth=4;g.beginPath();g.arc(b.x,b.y,90*(1-b.life/.4),0,6.2832);g.stroke();g.globalAlpha=1}}

player=entity(800,800);actors=[player];let fps=60;function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;if(last&&t>last)fps=fps*.95+Math.min(240,1000/(t-last))*.05;last=t;if((state==='play'||state==='spectate')&&!document.hidden){const steps=Math.max(1,Math.ceil(dt/.012));for(let i=0;i<steps&&(state==='play'||state==='spectate');i++)update(dt/steps)}render();requestAnimationFrame(frame)}hud();requestAnimationFrame(frame);
</script></html>
